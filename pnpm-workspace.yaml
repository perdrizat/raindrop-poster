packages:
  - client
  - server

# Only these packages may run postinstall build scripts (native binaries).
# Everything else is denied — supply-chain hardening.
onlyBuiltDependencies:
  - esbuild
  - puppeteer
  - sqlite3

# Supply-chain protection: refuse to install package versions published less
# than 7 days ago (10080 minutes), giving the ecosystem time to catch
# compromised releases before they reach this machine.
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true
  puppeteer: true
  sqlite3: true

# Security-advisory overrides (pnpm audit --fix=override). `pnpm audit` is clean.
overrides:
  '@tootallnate/once@<2.0.1': ^2.0.1
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  shell-quote@>=1.1.0 <=1.8.3: ^1.8.4
  tar@<7.5.7: ^7.5.7
  tar@<7.5.8: ^7.5.8
  tar@<=7.5.10: ^7.5.11
  tar@<=7.5.2: ^7.5.3
  tar@<=7.5.3: ^7.5.4
  tar@<=7.5.9: ^7.5.10
  undici@>=7.0.0 <7.28.0: ^7.28.0
  undici@>=7.23.0 <7.28.0: ^7.28.0

minimumReleaseAgeExclude:
  - tar@7.5.7
  - tar@7.5.3
  - tar@7.5.8
  - tar@7.5.10
  - tar@7.5.11
  - tar@7.5.4
  - '@tootallnate/once@2.0.1'
  - shell-quote@1.8.4
  - esbuild@0.28.1
  - form-data@4.0.6
  - undici@7.28.0
